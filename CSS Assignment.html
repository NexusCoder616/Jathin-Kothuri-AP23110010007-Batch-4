<!DOCTYPE html>
<html lang="en">
<head>
     <style>
        .custom-box {
            /* Fixes the sizing calculation to include borders and padding */
            box-sizing: border-box; 
            
            /* Dimensions */
            width: 150px;
            height: 150px;
            
            /* Visual Styles */
            background-color: #0482ff;
            border: 2px solid #0056b3;
            border-radius: 8px;
            
            /* Spacing rules per the standard CSS box model */
            padding: 20px;   /* Space inside the box */
            margin: 0px; 
            position: relative;
            z-index:20 ; /* Space outside the box */
        }
        .box-2{
             /* Fixes the sizing calculation to include borders and padding */
            box-sizing: border-box; 
            
            /* Dimensions */
            width: 150px;
            height: 150px;
            
            /* Visual Styles */
            background-color: #f21313;
            border: 2px solid #b30000;
            border-radius: 8px;
            overflow: auto;
            
            /* Spacing rules per the standard CSS box model */
            padding: 20px;   /* Space inside the box */
            margin: 0px; 
            position: relative;
            /*top: 100px;
            left:125px;
             /* Space outside the box */
        }
        .box-3{
            width:300px;
            height:300px;
            background-color: rgb(254, 255, 255);
            border:4px solid black;
            overflow:auto;
            padding: 20px;   /* Space inside the box */
            margin: 150px; 
            position: relative;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Web Page</title>
    
</head>
<body>
    <div class="custom-box">
        <p></p>
    </div>
    <div class="box-2">
        <p></p>
    </div>
    <div class="box-3">
        <p>hisonfiuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu</p>
    </div>
</body>
</html>
