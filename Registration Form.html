<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body>
    <form>
        <h1>Create a new account</h1>
        <font size="4">It's free and always will be.</font><br><br>
        
        <input type="text" id="Firstname" name="Firstname" placeholder="First Name">
        <input type="text" id="Surname" placeholder="Surname" ><br><br>
        <input type="text" id="Mobile" name="mobile" placeholder="Mobile Number or Email Address" size="46"><br><br>
        <input type="password" id="pass" name="pass" placeholder="New Password" size="46"><br><br>
        <label for="dob">Birthday</label><br>
        <div class="date-input-group">
  <input type="number" id="day" placeholder="DD" min="1" max="31" />
  <input type="number" id="month" placeholder="MM" min="1" max="12" />
  <input type="number" id="year" placeholder="YYYY" min="1900" max="2099" />
  <font color="blue">Why do I need to provide my date of birth?</font>
        </div><br><br>

    <input type="radio" id="female" name="  gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="male" name="  gender" value="male">
    <label for="male">Male</label><br><br>

        
        <input type="submit" value="Sign Up">
    </form>
    
</body>
</html>
